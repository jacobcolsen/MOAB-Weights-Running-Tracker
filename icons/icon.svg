<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background with iOS-style rounded corners -->
  <rect width="512" height="512" rx="114" fill="#0a0a0a"/>

  <!-- Barbell bar -->
  <rect x="152" y="238" width="208" height="36" rx="10" fill="#fb923c"/>

  <!-- Left inner plate -->
  <rect x="110" y="200" width="46" height="112" rx="10" fill="#fb923c"/>
  <!-- Left outer plate -->
  <rect x="64"  y="218" width="46" height="76"  rx="8"  fill="#c2410c"/>

  <!-- Right inner plate -->
  <rect x="356" y="200" width="46" height="112" rx="10" fill="#fb923c"/>
  <!-- Right outer plate -->
  <rect x="402" y="218" width="46" height="76"  rx="8"  fill="#c2410c"/>

  <!-- Collar rings -->
  <rect x="154" y="225" width="12" height="62" rx="4" fill="#fdba74"/>
  <rect x="346" y="225" width="12" height="62" rx="4" fill="#fdba74"/>

  <!-- MOAB wordmark -->
  <text
    x="256" y="404"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="80" font-weight="900"
    text-anchor="middle"
    fill="#ffffff"
    letter-spacing="-2">MOAB</text>
</svg>
