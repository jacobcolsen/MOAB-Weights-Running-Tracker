<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MOAB Icon Generator</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 32px; background: #1a1a1a; color: #e0e0e0; }
    h1   { font-size: 20px; margin: 0 0 8px; }
    p    { font-size: 14px; color: #888; margin: 0 0 24px; }
    code { background: #2a2a2a; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .previews { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
    .preview  { text-align: center; }
    .preview canvas { display: block; border-radius: 22%; border: 1px solid #333; }
    .preview span   { display: block; font-size: 11px; color: #666; margin-top: 6px; }
    .btn { margin-top: 20px; padding: 10px 20px; background: #fb923c; color: #000;
           font-weight: 700; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>
  <h1>MOAB Icon Generator</h1>
  <p>Opens in your browser and downloads the three PNG icon files. Place them in the <code>icons/</code> folder next to this file.</p>
  <div class="previews" id="previews"></div>
  <button class="btn" id="dl-btn">Download All Icons</button>

  <script>
    // Draw the MOAB barbell icon onto a canvas of the given pixel size
    function drawIcon(size) {
      const c   = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const s   = size / 512;  // scale factor

      // Rounded background
      const r = 114 * s;
      ctx.fillStyle = '#0a0a0a';
      rrect(ctx, 0, 0, size, size, r);
      ctx.fill();

      // Barbell bar
      ctx.fillStyle = '#fb923c';
      rrect(ctx, 152*s, 238*s, 208*s, 36*s, 10*s);
      ctx.fill();

      // Left inner plate
      rrect(ctx, 110*s, 200*s, 46*s, 112*s, 10*s);
      ctx.fill();

      // Right inner plate
      rrect(ctx, 356*s, 200*s, 46*s, 112*s, 10*s);
      ctx.fill();

      // Left outer plate
      ctx.fillStyle = '#c2410c';
      rrect(ctx, 64*s, 218*s, 46*s, 76*s, 8*s);
      ctx.fill();

      // Right outer plate
      rrect(ctx, 402*s, 218*s, 46*s, 76*s, 8*s);
      ctx.fill();

      // Collar highlights
      ctx.fillStyle = '#fdba74';
      rrect(ctx, 154*s, 225*s, 12*s, 62*s, 4*s);
      ctx.fill();
      rrect(ctx, 346*s, 225*s, 12*s, 62*s, 4*s);
      ctx.fill();

      // MOAB wordmark
      const fs = Math.round(80 * s);
      ctx.fillStyle = '#ffffff';
      ctx.font = `900 ${fs}px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('MOAB', size / 2, 404 * s);

      return c;
    }

    // Cross-browser rounded rect path (compatible with Safari < 15.4)
    function rrect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x,     y + h, x,     y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x,     y,     x + r, y);
      ctx.closePath();
    }

    function triggerDownload(canvas, filename) {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Render preview canvases
    const ICONS = [
      { size: 512, name: 'icon-512.png', label: '512 × 512 (manifest + maskable)' },
      { size: 192, name: 'icon-192.png', label: '192 × 192 (manifest)' },
      { size: 180, name: 'icon-180.png', label: '180 × 180 (iOS apple-touch-icon)' },
    ];

    const previews = document.getElementById('previews');

    ICONS.forEach(({ size, name, label }) => {
      const full    = drawIcon(size);
      const display = document.createElement('canvas');
      const dim     = Math.min(size, 120);
      display.width = display.height = dim;
      display.getContext('2d').drawImage(full, 0, 0, dim, dim);

      const wrap = document.createElement('div');
      wrap.className = 'preview';
      const span = document.createElement('span');
      span.textContent = label;
      wrap.appendChild(display);
      wrap.appendChild(span);
      previews.appendChild(wrap);
      wrap._canvas = full;
      wrap._name   = name;
    });

    document.getElementById('dl-btn').addEventListener('click', () => {
      ICONS.forEach(({ size, name }, i) => {
        const canvas = drawIcon(size);
        setTimeout(() => triggerDownload(canvas, name), i * 400);
      });
    });
  </script>
</body>
</html>
